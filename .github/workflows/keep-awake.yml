# Keeps the free Render service (docs/public-connector.md) awake from 05:00 to 23:20 IST and lets it sleep the rest of the night.
# GitHub schedules run in UTC; IST is UTC+5:30, so 05:00 IST is 23:30 UTC the day before and 23:20 IST is 17:50 UTC.
# The last ping is 23:20 IST; Render's free instance then sleeps after about 15 minutes. It only requests the public /healthz
# address, which answers "ok" and stores nothing. Runs can start a few minutes late; GitHub stops scheduled runs after 60 days
# without repo activity (re-enable under Actions, or press "Run workflow").
name: keep-awake

on:
  schedule:
    - cron: '30,40,50 23 * * *'  # 05:00 to 05:20 IST
    - cron: '*/10 0-17 * * *'    # 05:30 to 23:20 IST
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the server if it is there (the first request after a sleep can take about a minute)
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 https://chess-coach-public.onrender.com/healthz
